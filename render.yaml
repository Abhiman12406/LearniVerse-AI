# ==============================================================================
# LearniVerse-AI: Render Deployment Blueprint
# Conforming to RENDER.md §5, §14 and FEYNMAN.md §7, §8, §23
# Decoupled 3-Tier Production Architecture:
#   1. learniverse-frontend : Static Site (React 19 + Three.js 3D Virtual Classroom)
#   2. learniverse-backend  : Python Web Service (FastAPI + LangGraph + BKT + IRT)
#   3. learniverse-n8n      : Docker Web Service (Feynman Visual Workflow Orchestrator)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. 3D Adaptive Virtual Classroom Client (Render Static Site)
  # ----------------------------------------------------------------------------
  - type: web
    name: learniverse-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: learniverse-backend
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # ----------------------------------------------------------------------------
  # 2. LearniVerse FastAPI Core Backend (Render Python Web Service)
  # ----------------------------------------------------------------------------
  - type: web
    name: learniverse-backend
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python -m uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/feynman/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHONPATH
        value: "."
      # External AI & STT Keys (Optional: Resilient fallback if empty)
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      # External n8n Webhook connection (Optional: Resilient fallback to internal agent if empty)
      - key: N8N_WEBHOOK_URL
        sync: false
      # External Knowledge Graph (Optional: Resilient NetworkX in-memory DAG if empty)
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USERNAME
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      # External Semantic Caching (Optional: Resilient in-memory fallback if empty)
      - key: LANGCACHE_SERVER_URL
        sync: false
      - key: LANGCACHE_API_KEY
        sync: false

  # ----------------------------------------------------------------------------
  # 3. Feynman Agent n8n Orchestrator (Render Docker Web Service)
  # ----------------------------------------------------------------------------
  - type: web
    name: learniverse-n8n
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: n8n/Dockerfile
    dockerContext: n8n
    healthCheckPath: /healthz
    envVars:
      - key: FASTAPI_BACKEND_URL
        fromService:
          type: web
          name: learniverse-backend
          property: host
      - key: WEBHOOK_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: N8N_BLOCK_ENV_ACCESS_IN_NODE
        value: "false"
      - key: N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS
        value: "true"
      - key: GENERIC_TIMEZONE
        value: "UTC"
